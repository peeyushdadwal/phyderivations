<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Physics Derivation Trainer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --primary: #007AFF;
            --primary-dark: #005ec4;
            --soft-blue: #E3F2FD;
            --bg-color: #f2f6fa;
            --card-bg: #ffffff;
            --text-main: #2c2c2e;
            --text-sub: #86868B;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius: 24px;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ffcc00;
            --border: #eef2f6;
            --hover-overlay: rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --primary: #0A84FF;
            --primary-dark: #006ee6;
            --soft-blue: #1c2a38;
            --bg-color: #0f1115;
            --card-bg: #1e1e24;
            --text-main: #f0f0f5;
            --text-sub: #a0a0a5;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --border: #2c2c35;
            --hover-overlay: rgba(255,255,255,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 80px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Large Screen Scaling */
        @media (min-width: 1024px) {
            body { font-size: 110%; }
            .container { max-width: 700px !important; gap: 35px !important; }
            .topic-text { font-size: 1.6rem !important; }
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 70px;
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 100; transition: background-color 0.3s ease;
        }

        .nav-left { display: flex; align-items: center; gap: 10px; }
        .nav-title { font-weight: 700; font-size: 1.2rem; color: var(--text-main); }
        .nav-right { display: flex; align-items: center; gap: 12px; }

        .score-chip {
            background: var(--soft-blue); color: var(--primary);
            padding: 6px 14px; border-radius: 50px; font-weight: 700; font-size: 0.9rem;
        }

        .icon-btn {
            background: none; border: none; color: var(--text-sub);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 8px; border-radius: 50%; transition: color 0.2s;
        }
        .icon-btn:hover { color: var(--primary); background: var(--hover-overlay); }

        /* --- CONTAINER --- */
        .container {
            width: 100%; max-width: 500px; margin: 0 auto; padding: 20px;
            display: flex; flex-direction: column; gap: 25px;
        }

        /* --- STATS ROW --- */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-card {
            background: var(--card-bg); padding: 20px; border-radius: var(--radius);
            box-shadow: var(--shadow); text-align: center; cursor: pointer;
            border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-icon { font-size: 1.8rem; margin-bottom: 5px; }
        .stat-val { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
        .stat-label { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; }

        /* --- DROPDOWN --- */
        .custom-select-wrapper { position: relative; width: 100%; z-index: 50; }
        .custom-select-trigger {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 16px 20px; border-radius: 18px; font-size: 1rem; font-weight: 500;
            color: var(--text-main); box-shadow: var(--shadow); cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
        }
        .custom-select-wrapper.open { z-index: 201; }
        .custom-select-wrapper.open::before {
            content: ''; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(5px); z-index: -1;                     
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .custom-select-trigger:hover { border-color: var(--primary); }
        .arrow { transition: transform 0.2s; }
        .custom-select-wrapper.open .arrow { transform: rotate(180deg); }
        .custom-options {
            position: absolute; top: calc(100% + 10px); left: 0; right: 0;
            background: var(--card-bg); border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            border: 1px solid var(--border); overflow: hidden; opacity: 0; pointer-events: none;
            transform: translateY(-10px); transition: all 0.2s; max-height: 300px; overflow-y: auto;
        }
        .custom-select-wrapper.open .custom-options { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .custom-option {
            padding: 14px 20px; cursor: pointer; color: var(--text-main); font-size: 0.95rem;
            border-bottom: 1px solid var(--border); transition: background 0.2s;
        }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover { background: var(--hover-overlay); color: var(--primary); }
        .custom-option.selected { background: var(--soft-blue); color: var(--primary); font-weight: 600; }

        /* --- MAIN CARD --- */
        .main-card {
            background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
            border: 1px solid var(--border); padding: 30px 25px; text-align: center;
            min-height: 320px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; position: relative; overflow: hidden; transition: background-color 0.3s;
        }

        .topic-text {
            font-size: 1.3rem; line-height: 1.5; font-weight: 600; color: var(--text-main);
            margin: 20px 0 40px 0; animation: slideUp 0.4s ease-out; width: 100%;
        }

        .chapter-badge {
            display: inline-block; background: var(--soft-blue); color: var(--primary);
            font-size: 0.75rem; font-weight: 600; padding: 6px 12px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
        }

        /* --- TIMER --- */
        .timer-wrapper { width: 100%; margin-bottom: 30px; display: none; }
        .timer-display {
            font-size: 3.5rem; font-weight: 700; color: var(--text-main);
            font-variant-numeric: tabular-nums; margin-bottom: 10px; letter-spacing: -2px;
        }
        .progress-track { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--success); width: 100%; transition: width 1s linear, background-color 0.3s; }

        /* --- BUTTONS --- */
        .btn {
            border: none; padding: 16px 32px; border-radius: 18px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; width: 100%; display: flex; justify-content: center;
            align-items: center; gap: 8px; white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .btn-ghost { background: var(--border); color: var(--text-sub); }
        .btn-success { background: var(--success); color: white; flex: 2; box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3); }
        .btn-warning { background: var(--warning); color: black; box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3); }
        .btn-danger { background: var(--card-bg); color: var(--danger); border: 2px solid var(--danger); flex: 1; }
        .btn-group { display: flex; gap: 15px; width: 100%; }

        /* --- HISTORY MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 200;
            display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 500px; max-height: 80vh;
            margin: 0 auto; border-radius: var(--radius) var(--radius) 0 0; padding: 30px 20px;
            overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @media(min-width: 500px) {
            .modal-overlay { align-items: center; }
            .modal-content { border-radius: var(--radius); transform: translateY(20px); }
        }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        @media (max-width: 480px) {
            #activeControls .btn {
                font-size: 0;
                padding: 16px;
            }
            k {
                display: none;
            }
            
            #activeControls .btn .material-icons-round {
                font-size: 1.6rem; 
                margin: 0;
            }
        }
        .history-list { list-style: none; margin-top: 20px; }
        .history-item { 
            padding: 15px 0; border-bottom: 1px solid var(--border); 
            display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
            font-size: 0.9rem; color: var(--text-main);
        }
        .history-meta { display: flex; flex-direction: column; gap: 2px; }
        .history-time { font-size: 0.75rem; color: var(--text-sub); }
        .history-points { font-weight: 700; color: var(--text-sub); }
        .history-points.plus { color: var(--success); }
        .delete-btn { color: var(--text-sub); background: none; border: none; cursor: pointer; padding: 5px; }
        .delete-btn:hover { color: var(--danger); }

        /* --- UTILS --- */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }
        .material-icons-round { font-size: 1.25rem; }
        
        .floating-points {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 800; color: var(--success);
            animation: floatUp 1s ease-out forwards; pointer-events: none; text-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        @keyframes floatUp { to { opacity: 0; transform: translate(-50%, -100px) scale(1.2); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <span class="material-icons-round" style="color: var(--primary);">school</span>
            <div class="nav-title">Physics 12</div>
        </div>
        <div class="nav-right">
            <div class="score-chip" id="score">0 pts</div>
            
            <button class="icon-btn" id="soundBtn" onclick="game.toggleSound()">
                <span class="material-icons-round" id="soundIcon">volume_up</span>
            </button>
            
            <button class="icon-btn" id="themeBtn" onclick="game.toggleTheme()">
                <span class="material-icons-round" id="themeIcon">light_mode</span>
            </button>
        </div>
    </nav>

    <div class="container">
        
        <div class="stats-row">
            <div class="stat-card" onclick="game.showHistory('completed')">
                <span class="material-icons-round stat-icon" style="color: var(--success);">check_circle</span>
                <div class="stat-val" id="completedVal">0</div>
                <div class="stat-label">Done</div>
            </div>
            <div class="stat-card" onclick="game.showHistory('skipped')">
                <span class="material-icons-round stat-icon" style="color: var(--text-sub);">skip_next</span>
                <div class="stat-val" id="skippedVal">0</div>
                <div class="stat-label">Skipped</div>
            </div>
        </div>

        <div class="custom-select-wrapper" id="chapterSelectWrapper">
            <div class="custom-select-trigger" onclick="game.toggleDropdown()">
                <span id="dropdownText">All Chapters (Mixed)</span>
                <span class="material-icons-round arrow">expand_more</span>
            </div>
            <div class="custom-options">
                <div class="custom-option selected" data-value="all" onclick="game.selectChapter('all', 'All Chapters (Mixed)')">All Chapters (Mixed)</div>
                <div class="custom-option" data-value="1" onclick="game.selectChapter('1', 'Ch 1: Electric Charges')">Ch 1: Electric Charges</div>
                <div class="custom-option" data-value="2" onclick="game.selectChapter('2', 'Ch 2: Potential & Capacitance')">Ch 2: Potential & Capacitance</div>
                <div class="custom-option" data-value="3" onclick="game.selectChapter('3', 'Ch 3: Current Electricity')">Ch 3: Current Electricity</div>
                <div class="custom-option" data-value="4" onclick="game.selectChapter('4', 'Ch 4: Moving Charges')">Ch 4: Moving Charges</div>
            </div>
        </div>

        <div class="main-card" id="mainCard">
            <div class="chapter-badge" id="chapterBadge">Ready?</div>
            
            <div class="timer-wrapper" id="timerUI">
                <div class="timer-display" id="timerDisplay">05:00</div>
                <div class="progress-track">
                    <div class="progress-bar" id="progressFill"></div>
                </div>
            </div>

            <div class="topic-text" id="topicText">
                Select a chapter and click the button to start practicing.
            </div>

            <div style="width: 100%;">
                <button class="btn btn-primary" id="btnGet" onclick="game.rollDerivation()">
                    <span class="material-icons-round">shuffle</span> Get Derivation
                </button>
                
                <div class="btn-group hidden" id="selectionControls">
                    <button class="btn btn-ghost" onclick="game.handleSkip(false)">
                        <span class="material-icons-round">skip_next</span> Skip <k>(-2)</k>
                    </button>
                    <button class="btn btn-primary" onclick="game.startTimer()">
                        <span class="material-icons-round">play_arrow</span> Start
                    </button>
                </div>

                <div class="btn-group hidden" id="activeControls">
                    <button class="btn btn-danger" onclick="game.handleSkip(true)">
                        <span class="material-icons-round">flag</span> Give up
                    </button>
                    <button class="btn btn-warning" id="btnPause" onclick="game.togglePause()">
                        <span class="material-icons-round" id="pauseIcon">pause</span>
                    </button>
                    <button class="btn btn-success" onclick="game.handleComplete()">
                        <span class="material-icons-round">check</span> Done
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="historyModal">
        <div class="modal-content">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center;">
                <h2 id="modalTitle" style="font-size: 1.4rem; font-weight: 700;">History</h2>
                <button onclick="game.closeModal()" style="background:none; border:none; cursor:pointer;">
                    <span class="material-icons-round" style="font-size:1.5rem;">close</span>
                </button>
            </div>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

<script>
    // Added 'time' (mins) and 'prob' (weight) to columns
    const derivations = [
        { id: 1, text: "Coulomb's Law", ch: 1, time: 5, prob: 1.0 },
        { id: 2, text: "Vector form of Coulomb's Law (Newton's 3rd Law)", ch: 1, time: 5, prob: 1.0 },
        { id: 3, text: "Electric Field due to Dipole on Axial Line", ch: 1, time: 5, prob: 1.0, link: "https://www.youtube.com/watch?v=r1l8vqxY7ds" },
        { id: 4, text: "Electric Field due to Dipole on Equatorial Point", ch: 1, time: 5, prob: 1.0, link: "https://www.youtube.com/watch?v=YLZPjJl7L4I" },
        { id: 5, text: "Torque acting on a Dipole in Uniform Electric Field", ch: 1, time: 5, prob: 1.0, link: "https://www.youtube.com/watch?v=qABMhoEovpQ" },
        { id: 6, text: "Gauss's Theorem and its Proof", ch: 1, time: 5, prob: 1.0, link: "" },
        { id: 7, text: "Application of Gauss: E due to line charge", ch: 1, time: 5, prob: 1.0, link: "https://www.youtube.com/watch?v=mnW-I5kt9tQ" },
        { id: 8, text: "Application of Gauss: E due to uniformly Charged Spherical Shell", ch: 1, time: 5, prob: 1.0, link: "https://www.youtube.com/watch?v=Wshy5E0Bko0" },
        { id: 9, text: "Application of Gauss: E due to plane Sheet of Charge", ch: 1, time: 5, prob: 1.0, link: "https://www.youtube.com/watch?v=qPC-fdIsQvM" },
        { id: 10, text: "Electric Field due to Pair of Infinite Sheets", ch: 1, time: 5, prob: 1.0, link: "" },
        { id: 11, text: "Electric Potential due to a Point Charge", ch: 2, time: 5, prob: 1.0, link: "https://www.youtube.com/watch?v=CIdutvLPgq8" },
        { id: 12, text: "Electric Potential due to a Dipole", ch: 2, time: 5, prob: 1.0, link: "https://www.youtube.com/watch?v=D6h6IrS_HEw" },
        { id: 13, text: "Potential Energy of a Dipole in Uniform Electric Field", ch: 2, time: 5, prob: 1.0 }, 
        { id: 14, text: "Capacitance of Parallel Plate Capacitor with Conducting Slab", ch: 2, time: 5, prob: 1.0 },
        { id: 15, text: "Capacitance of Parallel Plate Capacitor with Dielectric Constant", ch: 2, time: 5, prob: 1.0 },
        { id: 16, text: "Energy Stored in a Parallel Plate Capacitor", ch: 2, time: 5, prob: 1.0 },
        { id: 17, text: "Energy Density of a Capacitor", ch: 2, time: 5, prob: 1.0 },
        { id: 18, text: "Common Potential of a Capacitor", ch: 2, time: 5, prob: 1.0 },
        { id: 19, text: "Energy Loss during Sharing of a Capacitor", ch: 2, time: 5, prob: 1.0 },
        { id: 20, text: "Drift Velocity", ch: 3, time: 5, prob: 1.0 },
        { id: 21, text: "Relation between Current and Drift Velocity", ch: 3, time: 5, prob: 1.0 },
        { id: 22, text: "Proof of Ohm's Law", ch: 3, time: 5, prob: 1.0 },
        { id: 23, text: "Kirchhoff's Voltage Law (KVL)", ch: 3, time: 5, prob: 1.0 },
        { id: 24, text: "Wheatstone Bridge Principle", ch: 3, time: 5, prob: 1.0 },
        { id: 25, text: "Biot-Savart's Law", ch: 4, time: 5, prob: 1.0 },
        { id: 26, text: "Vector form of Biot-Savart's Law", ch: 4, time: 5, prob: 1.0 },
        { id: 27, text: "Magnetic Field at Centre of Circular Current Coil", ch: 4, time: 5, prob: 1.0 },
        { id: 28, text: "Magnetic Field on Axis of Circular Current Coil", ch: 4, time: 5, prob: 1.0 },
        { id: 29, text: "Magnetic Field due to Straight Wire Carrying Current", ch: 4, time: 5, prob: 1.0 },
        { id: 30, text: "Magnetic Field due to Infinite Long Straight Wire", ch: 4, time: 5, prob: 1.0 },
        { id: 31, text: "Ampere's Circuital Law", ch: 4, time: 5, prob: 1.0 },
        { id: 32, text: "Motion of Charged Particle in Uniform Electric Field", ch: 4, time: 5, prob: 1.0 },
        { id: 33, text: "Force between Two Parallel Conductors (Def. of 1 Ampere)", ch: 4, time: 5, prob: 1.0 },
        { id: 34, text: "Force on Current-Carrying Conductor in Magnetic Field", ch: 4, time: 5, prob: 1.0 },
        { id: 35, text: "Torque on Current-Carrying Coil in Magnetic Field", ch: 4, time: 5, prob: 1.0 },
        { id: 36, text: "Moving Coil Galvanometer", ch: 4, time: 5, prob: 1.0 },
        { id: 37, text: "Conversion of Galvanometer to Ammeter", ch: 4, time: 5, prob: 1.0 },
        { id: 38, text: "Conversion of Galvanometer to Voltmeter", ch: 4, time: 5, prob: 1.0 },
    ];

    /* --- AUDIO SYSTEM --- */
    const Sound = {
        ctx: null,
        enabled: true,
        
        init() {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        },

        playTone(freq, type, duration, vol=0.1) {
            if(!this.enabled || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },

        tick() { this.playTone(800, 'sine', 0.1, 0.05); },
        chimeSuccess() { 
            this.playTone(400, 'sine', 0.2, 0.1); 
            setTimeout(() => this.playTone(600, 'sine', 0.4, 0.1), 150);
        },
        chimeFail() { 
            this.playTone(300, 'sawtooth', 0.3, 0.05); 
            setTimeout(() => this.playTone(200, 'sawtooth', 0.4, 0.05), 200);
        }
    };

    const game = {
        score: 0,
        history: { completed: [], skipped: [] },
        currentDerivation: null,
        activeFilter: 'all',
        timerInterval: null,
        totalTime: 300, 
        timeLeft: 300,
        isPaused: false,
        theme: 'light',
        soundOn: true,

        init() {
            this.loadData();
            Sound.init();
            this.updateStats();
            this.applyTheme();
            this.updateSoundIcon();

            // Click outside handling
            document.getElementById('historyModal').addEventListener('click', (e) => {
                if (e.target.id === 'historyModal') this.closeModal();
            });
            window.addEventListener('click', (e) => {
                const wrapper = document.getElementById('chapterSelectWrapper');
                if (!wrapper.contains(e.target)) {
                    wrapper.classList.remove('open');
                }
                if (!wrapper.contains(e.target) || e.target === wrapper) {
                    wrapper.classList.remove('open');
                }
            });
        },

        /* --- SAVE/LOAD --- */
        saveData() {
            const data = {
                score: this.score,
                history: this.history,
                theme: this.theme,
                soundOn: this.soundOn
            };
            localStorage.setItem('physicsTrainerData', JSON.stringify(data));
        },

        loadData() {
            const saved = localStorage.getItem('physicsTrainerData');
            if(saved) {
                const data = JSON.parse(saved);
                this.score = data.score || 0;
                this.history = data.history || { completed: [], skipped: [] };
                this.theme = data.theme || 'light';
                this.soundOn = data.soundOn !== undefined ? data.soundOn : true;
                Sound.enabled = this.soundOn;
            } else {
                // Check system pref for dark mode first run
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    this.theme = 'dark';
                }
            }
        },

        /* --- UI TOGGLES --- */
        toggleSound() {
            this.soundOn = !this.soundOn;
            Sound.enabled = this.soundOn;
            this.updateSoundIcon();
            this.saveData();
        },

        updateSoundIcon() {
            const icon = document.getElementById('soundIcon');
            icon.innerText = this.soundOn ? 'volume_up' : 'volume_off';
            icon.style.color = this.soundOn ? 'var(--primary)' : 'var(--text-sub)';
        },

        toggleTheme() {
            this.theme = this.theme === 'light' ? 'dark' : 'light';
            this.applyTheme();
            this.saveData();
        },

        applyTheme() {
            document.documentElement.setAttribute('data-theme', this.theme);
            document.getElementById('themeIcon').innerText = this.theme === 'light' ? 'light_mode' : 'dark_mode';
        },

        toggleDropdown() {
            if(document.getElementById('activeControls').classList.contains('hidden')) {
                document.getElementById('chapterSelectWrapper').classList.toggle('open');
            }
        },

        selectChapter(val, text) {
            this.activeFilter = val;
            document.getElementById('dropdownText').innerText = text;
            document.querySelectorAll('.custom-option').forEach(el => el.classList.remove('selected'));
            document.querySelector(`.custom-option[data-value="${val}"]`).classList.add('selected');
            document.getElementById('chapterSelectWrapper').classList.remove('open');
        },

        /* --- LOGIC --- */
        rollDerivation() {
            let pool = derivations;
            if (this.activeFilter !== 'all') {
                pool = derivations.filter(d => d.ch == this.activeFilter);
            }

            if(pool.length === 0) { alert("No derivations here."); return; }

            // Weighted Random Selection
            let totalWeight = pool.reduce((sum, item) => sum + (item.prob || 1), 0);
            let randomNum = Math.random() * totalWeight;
            let selectedItem = null;

            for (let item of pool) {
                randomNum -= (item.prob || 1);
                if (randomNum <= 0) {
                    selectedItem = item;
                    break;
                }
            }
            if(!selectedItem) selectedItem = pool[pool.length - 1]; // Fallback

            // Avoid immediate repeat
            if (this.currentDerivation && selectedItem.id === this.currentDerivation.id && pool.length > 1) {
                this.rollDerivation(); 
                return;
            }

            this.currentDerivation = selectedItem;
            
            // UI Update
            const topicEl = document.getElementById('topicText');
            topicEl.style.display = "none";
            topicEl.offsetHeight; 
            topicEl.style.display = "block";
            topicEl.innerText = selectedItem.text;

            document.getElementById('chapterBadge').innerText = `Chapter ${selectedItem.ch}`;
            document.getElementById('btnGet').classList.add('hidden');
            document.getElementById('selectionControls').classList.remove('hidden');
        },

        startTimer() {
            document.getElementById('selectionControls').classList.add('hidden');
            document.getElementById('activeControls').classList.remove('hidden');
            document.getElementById('timerUI').style.display = 'block';
            document.getElementById('chapterSelectWrapper').style.opacity = '0.6';
            
            // Set time from data (mins * 60)
            this.totalTime = (this.currentDerivation.time || 5) * 60;
            this.timeLeft = this.totalTime;
            this.isPaused = false;
            this.updateTimerDisplay();
            
            // Resume Audio Context if needed (browsers block autoplay)
            if(Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();

            this.timerInterval = setInterval(() => this.tick(), 1000);
        },

        tick() {
            if(this.isPaused) return;
            
            this.timeLeft--;
            this.updateTimerDisplay();
            
            // Tick sound last 10 seconds
            if(this.timeLeft <= 10 && this.timeLeft > 0) Sound.tick();

            if (this.timeLeft <= 0) this.handleTimeout();
        },

        updateTimerDisplay() {
            const mins = Math.floor(this.timeLeft / 60);
            const secs = this.timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            const pct = (this.timeLeft / this.totalTime) * 100;
            const bar = document.getElementById('progressFill');
            bar.style.width = `${pct}%`;
            
            if(this.timeLeft < 30) bar.style.background = "var(--danger)";
            else bar.style.background = "var(--success)";
        },

        togglePause() {
            this.isPaused = !this.isPaused;
            document.getElementById('pauseIcon').innerText = this.isPaused ? "play_arrow" : "pause";
        },

        handleComplete() {
            clearInterval(this.timerInterval);
            Sound.chimeSuccess();

            const timeSpent = this.totalTime - this.timeLeft;
            const mins = Math.floor(timeSpent / 60);
            const secs = timeSpent % 60;
            const timeStr = `${mins}m ${secs}s`;

            const minutesLeft = Math.floor(this.timeLeft / 60);
            const bonus = minutesLeft; 
            const totalPoints = 5 + bonus;

            this.history.completed.push({
                topic: this.currentDerivation.text,
                points: totalPoints,
                timeStr: `Took ${timeStr}`,
                timestamp: Date.now()
            });

            this.score += totalPoints;
            this.showFloatingPoints(totalPoints);
            this.resetUI("Perfect!", "var(--success)");
            this.saveData();
        },

        handleSkip(duringTimer) {
            if(duringTimer) clearInterval(this.timerInterval);
            Sound.chimeFail();
            let timeStr = "Skipped";
            if(duringTimer) {
                const timeSpent = this.totalTime - this.timeLeft;
                timeStr = `Gave up after ${Math.floor(timeSpent/60)}m ${timeSpent%60}s`;
            }

            this.history.skipped.push({
                topic: this.currentDerivation.text,
                points: -2,
                timeStr: timeStr,
                timestamp: Date.now()
            });

            this.score -= 2;
            this.showFloatingPoints(-2);
            this.resetUI("Skipped", "var(--text-sub)");
            this.saveData();
        },

        handleTimeout() {
            clearInterval(this.timerInterval);
            Sound.chimeFail();
            
            this.history.skipped.push({
                topic: this.currentDerivation.text + " (Timeout)",
                points: -1,
                timeStr: `Ran out of time (${this.currentDerivation.time}m)`,
                timestamp: Date.now()
            });
            this.score -= 1;
            this.showFloatingPoints(-1);
            this.resetUI("Time's Up!", "var(--danger)");
            this.saveData();
        },

        showFloatingPoints(val) {
            const card = document.getElementById('mainCard');
            const el = document.createElement('div');
            el.classList.add('floating-points');
            el.innerText = val > 0 ? `+${val}` : val;
            el.style.color = val > 0 ? 'var(--success)' : 'var(--danger)';
            card.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        },

        resetUI(msg, color) {
            this.updateStats();
            const badge = document.getElementById('chapterBadge');
            badge.innerText = msg;
            badge.style.backgroundColor = color;
            badge.style.color = 'white';

            document.getElementById('activeControls').classList.add('hidden');
            document.getElementById('selectionControls').classList.add('hidden');
            document.getElementById('timerUI').style.display = 'none';
            document.getElementById('chapterSelectWrapper').style.opacity = '1';
            document.getElementById('pauseIcon').innerText = "pause";

            setTimeout(() => {
                badge.style.backgroundColor = 'var(--soft-blue)';
                badge.style.color = 'var(--primary)';
                document.getElementById('btnGet').classList.remove('hidden');
                
                if(!this.currentDerivation) {
                     badge.innerText = "Ready?";
                     document.getElementById('topicText').innerText = "Select a chapter above.";
                } else {
                     badge.innerText = "Next?";
                     document.getElementById('topicText').innerText = "Ready for the next one?";
                }
            }, 1500);
        },

        updateStats() {
            document.getElementById('score').innerText = `${this.score} pts`;
            document.getElementById('completedVal').innerText = this.history.completed.length;
            document.getElementById('skippedVal').innerText = this.history.skipped.length;
        },

        /* --- HISTORY MODAL --- */
        showHistory(type) {
            const list = type === 'completed' ? this.history.completed : this.history.skipped;
            const title = type === 'completed' ? 'Completed Derivations' : 'Skipped / Failed';
            const ul = document.getElementById('historyList');
            
            document.getElementById('modalTitle').innerText = title;
            ul.innerHTML = '';

            if (list.length === 0) {
                ul.innerHTML = '<li class="history-item" style="justify-content:center; color:var(--text-sub)">No records yet.</li>';
            } else {
                [...list].reverse().forEach((item, index) => {
                    // Real index in original array is: length - 1 - index
                    const originalIndex = list.length - 1 - index;
                    
                    const li = document.createElement('li');
                    li.classList.add('history-item');
                    const ptsClass = item.points > 0 ? 'plus' : '';
                    const ptsText = item.points > 0 ? `+${item.points}` : item.points;
                    
                    li.innerHTML = `
                        <div class="history-meta">
                            <span>${item.topic}</span>
                            <span class="history-time">${item.timeStr || ''}</span>
                        </div>
                        <span class="history-points ${ptsClass}">${ptsText}</span>
                        <button class="delete-btn" onclick="game.deleteItem('${type}', ${originalIndex})">
                            <span class="material-icons-round" style="font-size:1.2rem">delete</span>
                        </button>
                    `;
                    ul.appendChild(li);
                });
            }
            document.getElementById('historyModal').classList.add('open');
        },

        deleteItem(type, index) {
            if(type === 'completed') {
                this.history.completed.splice(index, 1);
            } else {
                this.history.skipped.splice(index, 1);
            }
            this.saveData();
            this.updateStats();
            this.showHistory(type); // Refresh modal
        },

        closeModal() {
            document.getElementById('historyModal').classList.remove('open');
        }
    };

    game.init();
</script>
</body>
</html>
